{% extends "base.html" %}
{% block title %}Producto | Inventario SPL{% endblock %}
{% block content %}
<div class="tarjeta" style="max-width:560px">
  <h1>{% if object %}Editar producto{% else %}Nuevo producto{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primario" type="submit">Guardar</button>
    <a class="btn btn-claro" href="{% url 'core:producto_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
