{% if form.non_field_errors %}
  <div class="alerta-error">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>
{% endif %}
{% for field in form %}
  <div class="campo{% if field.errors %} con-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
    {% if field.help_text and mostrar_ayuda %}<div class="ayuda">{{ field.help_text|safe }}</div>{% endif %}
  </div>
{% endfor %}
